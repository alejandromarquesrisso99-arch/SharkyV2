[project]
name = "sharky"
version = "0.1.0"
description = "Vigilancia de una cartera real de inversion en euros para Windows"
authors = [
    { name = "Alejandro", email = "alejandro.marques.risso.99@gmail.com" }
]
requires-python = "==3.12.*"
dependencies = [
    "anthropic>=1.8.0",
    "keyring>=25.7.0",
    "pydantic>=2.13.5",
    "pyqtgraph>=0.14.0",
    "pyside6>=6.11.2",
    "yfinance>=1.7.0",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "pytest>=9.1.1",
    "pytest-qt>=4.5.0",
    "ruff>=0.16.8",
]
